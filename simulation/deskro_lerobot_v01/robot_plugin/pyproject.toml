[build-system]
requires = ["setuptools>=71"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_deskro"
version = "0.1.0"
description = "LeRobot hardware plugin for the ESP32-based DESKRO desktop robot"
requires-python = ">=3.12"
dependencies = [
  "lerobot==0.6.1",
  "pyserial>=3.5,<4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lerobot_robot_deskro*"]
